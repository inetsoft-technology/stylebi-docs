site:
  title: StyleBI Documentation
  url: https://www.inetsoft.com/docs/stylebi
  start_page: InetSoftUserDocumentation:ROOT:index.adoc

content:
   #edit_url: 'https://repo.inetsoft.com/docs/inetsoft/files/master/{path}'
   sources: 
   - url: ../
     branches: [v1.1.x, v2.0.x]
     start_path: InetSoftUserDocumentation

ui:
  bundle:
    url: ../ui/build/ui-bundle.zip

antora:
  extensions:
  - require: '@antora/lunr-extension'
  - ./antora-router-extension.js
  - ./versioned-router-extension.js
  # Help buttons on patch releases open <patch version>/index.html; forward those to
  # the docs version that covers them. Keys and values must be quoted strings.
  - require: ./version-alias-extension.js
    aliases:
      '2.0.1': '2.0.0'
    
asciidoc:
  attributes:
    testdrive: false
    si: true
    # Report references to undefined {attributes} instead of silently dropping them
    attribute-missing: warn
    
runtime:
  log:
    format: pretty
    # Fail the build (and skip publishing) on errors such as broken xrefs, includes, or images
    failure_level: error
